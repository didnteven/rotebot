<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Rotebot — Show it once. Make it routine.</title>
  <desc id="desc">A violet robot beside a glowing path from a repetitive chore to a checked, reusable tool, on a dark indigo background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111329"/><stop offset="1" stop-color="#201743"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="shell" x2=".7" y2="1"><stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#9b87f5"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <ellipse cx="1000" cy="225" rx="320" ry="265" fill="url(#halo)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="64" y="56" width="228" height="30" rx="15" fill="#c4b5fd" fill-opacity=".09" stroke="#c4b5fd" stroke-opacity=".18"/>
    <circle cx="81" cy="71" r="4" fill="#5eead4"/>
    <text x="95" y="76" fill="#d8d0f7" font-size="12" font-weight="600" letter-spacing="1.4">SMALL TOOLS. BIG RELIEF.</text>
    <text x="60" y="181" fill="#faf8ff" font-size="88" font-weight="750" letter-spacing="-5">Rotebot</text>
    <text x="65" y="237" fill="#f1edff" font-size="32" font-weight="600" letter-spacing="-.8">Show it once. Make it routine.</text>
    <text x="65" y="282" fill="#b8b2d3" font-size="19">Turn everyday chores into reusable tools.</text>
    <text x="65" y="312" fill="#b8b2d3" font-size="19">Built by AI. Checked by the host. Approved by you.</text>
    <path d="M66 365H574" stroke="#c4b5fd" stroke-opacity=".18"/>
    <text x="65" y="402" fill="#bcb4d8" font-size="12" font-weight="600" letter-spacing="2">DESCRIBE</text>
    <path d="M164 397h25m-5-4 5 4-5 4" fill="none" stroke="#83739e"/>
    <text x="209" y="402" fill="#bcb4d8" font-size="12" font-weight="600" letter-spacing="2">BUILD</text>
    <path d="M277 397h25m-5-4 5 4-5 4" fill="none" stroke="#83739e"/>
    <text x="322" y="402" fill="#bcb4d8" font-size="12" font-weight="600" letter-spacing="2">CHECK</text>
    <path d="M392 397h25m-5-4 5 4-5 4" fill="none" stroke="#83739e"/>
    <text x="437" y="402" fill="#5eead4" font-size="12" font-weight="600" letter-spacing="2">RUN AGAIN</text>
    <g transform="translate(865 106)">
      <ellipse cx="115" cy="245" rx="110" ry="16" fill="#080b1b" fill-opacity=".5"/>
      <path d="M115 21V2" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>
      <circle cx="115" cy="-3" r="10" fill="#5eead4"/>
      <rect x="58" y="153" width="114" height="73" rx="28" fill="url(#shell)"/>
      <rect x="62" y="208" width="39" height="30" rx="13" fill="#a994ee"/>
      <rect x="129" y="208" width="39" height="30" rx="13" fill="#a994ee"/>
      <path d="M60 176 35 191m137-15 25 15" stroke="#c4b5fd" stroke-width="23" stroke-linecap="round"/>
      <rect x="7" y="67" width="23" height="48" rx="11" fill="#a994ee"/>
      <rect x="200" y="67" width="23" height="48" rx="11" fill="#a994ee"/>
      <rect x="21" y="22" width="188" height="142" rx="48" fill="url(#shell)"/>
      <rect x="40" y="47" width="150" height="91" rx="31" fill="#1b1837"/>
      <rect x="68" y="73" width="17" height="25" rx="8.5" fill="#5eead4"/>
      <rect x="145" y="73" width="17" height="25" rx="8.5" fill="#5eead4"/>
      <path d="M100 109q15 13 30 0" fill="none" stroke="#dcd6fa" stroke-width="5" stroke-linecap="round"/>
      <path d="m104 184 8 8 17-18" fill="none" stroke="#3e356c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(720 82) rotate(-9)">
      <rect width="106" height="122" rx="14" fill="#23213d" stroke="#70628e"/>
      <rect x="18" y="20" width="33" height="6" rx="3" fill="#a78bfa"/>
      <path d="M19 45h68M19 60h68M19 75h48M19 90h58" stroke="#827694" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M772 233c0 95 116 123 208 123h86" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="5 7"/>
    <g transform="translate(1063 321)">
      <rect width="147" height="69" rx="16" fill="#182f36" stroke="#5eead4" stroke-opacity=".45"/>
      <circle cx="26" cy="26" r="11" fill="#5eead4" fill-opacity=".15"/>
      <path d="m21 26 4 4 7-8" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
      <text x="46" y="31" fill="#b9f7e7" font-size="14" font-weight="600">Checked.</text>
      <text x="17" y="52" fill="#a6c2c4" font-size="12">Ready for next time.</text>
    </g>
    <path d="M1177 122v18m-9-9h18M824 286v12m-6-6h12" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <circle cx="1133" cy="65" r="3" fill="#5eead4" opacity=".7"/>
    <circle cx="756" cy="343" r="3" fill="#a78bfa" opacity=".7"/>
  </g>
</svg>
