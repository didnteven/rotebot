[package]
name = "macroscope-muse-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
macroscope-vault.workspace = true
macroscope-protocol.workspace = true
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }
libc = "0.2"
zeroize = "1"
sha2 = "0.10"
tempfile = "3"

# sha2-asm does not build for Windows targets.
[target.'cfg(not(windows))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

