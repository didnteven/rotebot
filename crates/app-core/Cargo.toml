[package]
name = "macroscope-app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["generated-runtime"]
generated-runtime = ["dep:macroscope-runner"]
synthetic-runtime-tests = ["generated-runtime"]

[dependencies]
macroscope-runner = { path = "../runner", optional = true }
macroscope-domain.workspace = true
macroscope-storage.workspace = true
macroscope-vault.workspace = true
macroscope-policy.workspace = true
macroscope-model-gateway.workspace = true
macroscope-muse-client.workspace = true
macroscope-builder.workspace = true
macroscope-executor.workspace = true
macroscope-effect-broker.workspace = true
macroscope-connections.workspace = true
jsonschema = { version = "0.60", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
sha2 = "0.10"
png = "0.18.1"
regex = "1.13.1"
hex = "0.4"
csv = "1"
time = "0.3"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
