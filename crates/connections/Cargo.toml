[package]
name = "macroscope-connections"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
zeroize = "1"
bytes = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
mail-parser = "0.11"
futures = "0.3"

[dev-dependencies]
futures-core.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
