[package]
name = "macroscope-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri-plugin-single-instance = "=2.5.4"
tauri.workspace = true
serde.workspace = true
macroscope-app-core.workspace = true
macroscope-domain.workspace = true
macroscope-builder.workspace = true
macroscope-vault.workspace = true
macroscope-muse-client.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[features]
default = ["generated-runtime"]
generated-runtime = ["macroscope-app-core/generated-runtime"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3"
